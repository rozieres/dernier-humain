<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI — banc d'essai</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
    #stage { position: fixed; inset: 0; overflow: hidden; }
    #stage .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #5d9fd6 0%, #9cc9ea 38%, #e8e3cf 58%, #f6d9a8 62%); }
    #stage .sun { position: absolute; left: 70%; top: 34%; width: 16vmin; height: 16vmin; border-radius: 50%; transform: translate(-50%, -50%);
      background: radial-gradient(circle, #fffef6 0 22%, rgba(255, 244, 210, 0.85) 30%, rgba(255, 220, 160, 0) 70%); }
    #stage .far { position: absolute; left: -5%; right: -5%; top: 44%; height: 22%; background: linear-gradient(180deg, #8ea6c8, #b6c4cf);
      clip-path: polygon(0 70%, 8% 52%, 15% 60%, 24% 30%, 31% 42%, 38% 22%, 46% 46%, 55% 38%, 63% 12%, 70% 36%, 78% 28%, 86% 50%, 94% 40%, 100% 55%, 100% 100%, 0 100%); }
    #stage .monolith { position: absolute; top: 30%; width: 1.4%; height: 27%; background: linear-gradient(90deg, #d7f6f8, #8fd8e0); box-shadow: 0 0 3vmin rgba(92, 225, 230, 0.6); }
    #stage .sea { position: absolute; left: 0; right: 0; top: 57.5%; height: 8%; background: linear-gradient(180deg, #7fc6cf, #2bb7b3 60%, #1e8f95); }
    #stage .mid { position: absolute; left: -5%; right: -5%; top: 54%; bottom: 0; background: linear-gradient(180deg, #8dbb52, #6fae3c 40%, #4f8a2c);
      clip-path: polygon(0 32%, 12% 20%, 22% 26%, 34% 10%, 45% 18%, 56% 6%, 66% 16%, 78% 8%, 88% 22%, 100% 14%, 100% 100%, 0 100%); }
    #stage .near { position: absolute; left: -10%; right: -10%; top: 74%; bottom: 0; background: linear-gradient(180deg, #a8d05a, #79b342 50%, #4d7f2b);
      clip-path: ellipse(70% 100% at 40% 100%); }
    #stage .path { position: absolute; left: 44%; top: 70%; bottom: -5%; width: 12%; background: linear-gradient(180deg, rgba(201, 170, 120, 0.6), #c9a978);
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); }
    #stage.night .sky { background: linear-gradient(180deg, #050915 0%, #0f1a33 50%, #263552 62%); }
    #stage.night .sun { left: 30%; top: 22%; width: 5vmin; height: 5vmin; background: radial-gradient(circle, #e9eef8 0 40%, rgba(200, 210, 240, 0) 70%); }
    #stage.night .far { background: linear-gradient(180deg, #1a2238, #222d44); }
    #stage.night .mid { background: linear-gradient(180deg, #1b2a26, #0f1a17); }
    #stage.night .near { background: linear-gradient(180deg, #16231f, #0b1512); }
    #stage.night .sea { background: linear-gradient(180deg, #102a3a, #0e3a4a); }
    #stage.night .path { background: linear-gradient(180deg, rgba(60, 50, 40, 0.5), #2a241d); }
    #dev { position: fixed; right: 0; top: 0; bottom: 0; width: 210px; z-index: 100; overflow-y: auto; padding: 10px; box-sizing: border-box;
      background: rgba(20, 20, 24, 0.92); color: #ddd; font: 12px/1.3 monospace; transition: transform 0.2s; }
    #dev.hidden { transform: translateX(100%); }
    #dev h4 { margin: 10px 0 4px; color: #ffb454; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
    #dev button { display: block; width: 100%; margin: 2px 0; padding: 4px 6px; text-align: left; background: #2a2a30; color: #eee; border: 1px solid #444; font: inherit; cursor: pointer; }
    #dev button:hover { background: #3a3a44; }
    #dev .row { display: flex; gap: 4px; }
    #dev .row button { flex: 1; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="sky"></div><div class="sun"></div><div class="far"></div>
    <div class="monolith" style="left: 47%"></div><div class="monolith" style="left: 50%; height: 31%; top: 26%"></div><div class="monolith" style="left: 53%; height: 24%; top: 33%"></div>
    <div class="sea"></div><div class="mid"></div><div class="near"></div><div class="path"></div>
  </div>
  <div id="ui"></div>
  <div id="dev"></div>
  <script type="module" src="./ui.js"></script>
</body>
</html>
